<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c4a6e" />
    <title>Offline · Trời Hôm Nay</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #070b14;
        --fg: #e2e8f0;
        --muted: #94a3b8;
        --accent: #0ea5e9;
        --card: rgba(15, 23, 42, 0.85);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f0f4fb;
          --fg: #0f172a;
          --muted: #64748b;
          --card: #ffffff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: radial-gradient(120% 80% at 50% 0%, rgba(14, 165, 233, 0.18), transparent), var(--bg);
        color: var(--fg);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.25rem;
      }
      .card {
        max-width: 22rem;
        width: 100%;
        padding: 1.75rem;
        border-radius: 1.25rem;
        background: var(--card);
        border: 1px solid rgba(148, 163, 184, 0.2);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.25rem;
        font-size: 0.9rem;
        line-height: 1.5;
        color: var(--muted);
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }
      a,
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0 1rem;
        border-radius: 9999px;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        border: none;
        width: 100%;
      }
      .primary {
        background: linear-gradient(to bottom, #38bdf8, var(--accent));
        color: #fff;
      }
      .ghost {
        background: transparent;
        color: var(--fg);
        border: 1px solid rgba(148, 163, 184, 0.35);
      }
    </style>
  </head>
  <body>
    <div class="card" role="status">
      <div style="font-size: 2.5rem; margin-bottom: 0.5rem" aria-hidden>📡</div>
      <h1>Không có mạng</h1>
      <p>Trời Hôm Nay cần kết nối để tải dự báo mới. Dữ liệu thời tiết/AQI đã xem gần đây có thể vẫn dùng được trong app.</p>
      <div class="actions">
        <button type="button" class="primary" onclick="location.reload()">Thử lại</button>
        <a class="ghost" href="/thoi-tiet">Về dự báo</a>
      </div>
    </div>
  </body>
</html>
